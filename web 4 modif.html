<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<HTML>
<HEAD>
<TITLE>Menampilkan Gambar dan Video</TITLE>
<META NAME="Generator" CONTENT="EditPlus">
<META NAME="Author" CONTENT="Endar Nirmala">
<META NAME="Keywords" CONTENT="multimedia, html">
<META NAME="Description" CONTENT="Pembelajaran Online - Menampilkan Gambar dan Video">
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #fafafa;
        margin: 30px;
        color: #222;
    }
    h1 {
        text-align: center;
        color: #1a73e8;
    }
    hr {
        border: 1px solid #ccc;
        margin: 20px 0;
    }
    .media-box {
        text-align: center;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 10px;
        background: #fff;
        margin-bottom: 20px;
    }
</style>
</HEAD>

<BODY>
<h1>MENAMPILKAN GAMBAR DAN VIDEO</h1>
<hr>

<!-- BAGIAN GAMBAR -->
<div class="media-box">
    <h2>1. Menampilkan Gambar (GIF)</h2>
    <img src="Cat GIF - Cat - Discover & Share GIFs.gif" width="600" height="100" alt="mybanner" title="Banner Animasi">
    <p>kucing berjalan</p>
</div>

<!-- BAGIAN VIDEO -->
<div class="media-box">
    <h2>2. Menampilkan Video</h2>
    <video width="400" height="300" controls loop>
        <source src="BLACK SWAN _ Feather Scene.mp4" type="video/mp4">
        Browser Anda tidak mendukung elemen <code>&lt;video&gt;</code>.
    </video>
    <p>Black swan 2010</p>
</div>

</BODY>
</HTML>
